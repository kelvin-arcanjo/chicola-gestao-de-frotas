<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatura Chicola.M</title>
    <link rel="stylesheet" href="style.css">
   <link rel="shortcut icon" href="images/chicolamfav.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div class="logo-container">

            <img src="images/chicolambrand.png" alt="Logo da Chicola.M" class="logo-img">

            <div class="text-container">
                <h1>CHICOLA<span id="abreviation">.M</span></h1>
                <h2>TECNOLOGIA & SERVIÇOS</h2>
            </div>
        </div>
    </header>

    <h2 id="candidaturas">Candidatura de Condutor ↡</h2>

    <div class="card">
        <form id="formCandidatura">
            <label for="name">Nome:</label> <br>
            <input type="text" id="name" name="nome" required> <br>
            <label for="phone">Telefone:</label> <br>
            <input type="text" id="phone" name="telefone" required> <br>
            <label for='vehicle_type'>Tipo de Veículo:</label> <br>
            <select id="vehicle_type" name="veiculo" required>
                <option value="Viatura">Viatura</option>
                <option value="Motorizada">Motorizada</option>
            </select> <br>
            <button type="submit" id="btnSubmit">Submeter Candidatura</button>
        </form>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
