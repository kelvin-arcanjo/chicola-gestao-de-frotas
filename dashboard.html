<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Chicola.M</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/chicolamfav.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div class="logo-container">

            <img src="images/chicolambrand.png" alt="Logo da Chicola.M" class="logo-img">

            <div class="text-container">
                <h1>CHICOLA<span id="abreviation">.M</span></h1>
                <h2>TECNOLOGIA & SERVIÇOS</h2>
            </div>
        </div>
    </header>

    <h1 id="h1dashboard">Candidaturas Pendentes</h1>

     <table border="1" id="tabelaCandidaturas">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Tipo de Veículo</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
            <!-- Renderização via JS -->
        </tbody>
    </table>

    <script src="dashboard.js"></script>
</body>
</html>
